services:
  microsoft-account-manager:
    container_name: microsoft-account-manager
    build:
      context: .
      dockerfile: Dockerfile
    image: microsoft-account-manager:latest
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      PORT: 8787
    ports:
      - "8787:8787"
    volumes:
      - ./data/wrangler:/app/.wrangler
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
