services:
  microsoft-account-manager:
    container_name: microsoft-account-manager
    image: ${APP_IMAGE}
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "${PORT:-8787}:8787"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 512m
    cpus: 1
